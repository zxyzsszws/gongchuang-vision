# 相机外参示例（像素 → 车体毫米）。**必须用实测值替换后再跑 live/replay。**
#
# 生成方式（两处已知点即可）：
#   python tools/calibrate_camera.py \
#       --px 180,240 --px 460,240 --mm 300,0 --mm 700,0 \
#       --out config/camera_calib.yaml
#
# 车体坐标系口径：相机光轴正下方地面点为原点，车头 +y、右侧 +x，单位 mm。
# 下面这组数值仅用于让 sim/单测与结构检查跑通，**不要拿去比赛**。
image_to_robot:
  scale_mm_per_px: 1.5      # 每像素对应多少毫米（路面平面上的近似）
  rot_deg: 180.0            # 图像 y 朝下、车头 +y 朝上 → 通常为 180 或 ±90 量级
  tx_mm: -480.0             # 图像原点(左上角)映射到车体的平移
  ty_mm: -360.0
# 距离变化较大（远近都能看到三色环）时开启：尺度按三色环半径实时自估，
# 赛前只需量准安装角与偏移。
auto_scale_from_tri: false

# 相机外参示例（像素 → 车身毫米）。**必须用实测值替换后再跑 live/replay。**
#
# 生成方式（两对已知点即可）：
#   python tools/calibrate_camera.py ^
#       --pair 170,240,-150,0 --pair 470,240,150,0 ^
#       --out config/camera_calib.yaml
#
# 车身坐标系口径（文档附录二第四节）：
#   原点 = **机械臂底座中心在地面的投影**（不是相机光轴！两者差几十毫米，
#          且这个偏差不会引发任何报错，只会让上报位置整体偏掉）
#   车头方向 +y、右侧 +x，单位 mm
#
# 下面这组数值仅用于让结构检查跑通，**不要拿去比赛**。
image_to_robot:
  scale_mm_per_px: 1.5      # 每像素对应多少毫米（地面平面上的近似）
  rot_deg: 180.0            # 图像 y 朝下、车头 +y 朝上 → 通常为 180 或 ±90 量级
  tx_mm: -480.0             # 图像原点(左上角)映射到车体的平移
  ty_mm: -360.0

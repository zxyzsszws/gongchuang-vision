mode: sim
camera:
  main_index: 0          # 主摄（主圆识别、转盘颜色）
  qr_index: 1            # 扫码相机（花雀广角）；与 main_index 相同则复用主摄
  qr_model_dir: ""       # WeChatQRCode 4 个模型所在目录；留空=OpenCV 内建缺省（辨识率低）
  width: 640
  height: 480
  fps: 30
serial: {port: COM3, baudrate: 115200}

# sim 模式的合成场景参数
#   jitter_mm:            合成观测的高斯抖动（标准差，mm）
#   turntable_omega01:    转盘角速度，0.1°/s（600 = 60°/s，即 6s 一圈）
#   turntable_stop_after_s: 多少秒之后转盘停住；留空 = 一直转
sim:
  jitter_mm: 0.3
  turntable_omega01: 600
  turntable_stop_after_s: 1.5

# 时序参数（与 docs/protocol-v2.2.0.md 表 1-12 一一对应）
#   frame_interval_ms:  等条件时多久取一帧（转盘停稳判定、扫码重试）
#   scan_timeout_s:     一次扫码请求最长等多久，超时回「没准备好」
#   turntable_timeout_s: 一次取料点颜色请求最长等多久（要盖住转盘转一圈的时间）
#   max_bad_requests:   连续收到多少个不合法请求就进入安全停止
timing:
  frame_interval_ms: 20
  scan_timeout_s: 3
  turntable_timeout_s: 3
  max_bad_requests: 5

# 主圆检测（同心圆聚类）
#   search_radius: 半径搜索范围（像素），须覆盖最小圈到最外圈
#   cluster_tol_px: 圆心聚类容差，多圈同心圆的圆心误差远小于此值
#   min_rings: 至少几圈才认作一个靶（单个孤立的圆无法与杂散圆区分）
#   min_circularity: 圆度门限（4πA/P²，正圆=1.0），低于此值视为非圆轮廓
#   min_fill: 充满度门限（轮廓面积/最小外接圆面积）。圆与椭圆都≈1.0，正方形仅 0.64，
#             这是区分「圆」与「方形/多边形」最有效的判据
#   same_radius_ratio: 半径相对差低于此值视为同一圈的重复检出
#   dedup_px: 环带内、外两条轮廓会被各检出一次，圆心距与半径差都小于此值时去重
#   ring_outer_mm: 主圆外圈的**实际直径**（mm），赛前实测。视觉用它反算 mm/px，
#             这是对准精度的唯一尺度来源——量错了 d 就整体按比例偏
#   threshold_block / threshold_c: 自适应阈值的块大小与常数
target:
  search_radius: [10, 120]
  cluster_tol_px: 12.0
  min_rings: 3
  min_circularity: 0.70
  min_fill: 0.85
  same_radius_ratio: 0.12
  dedup_px: 3.0
  ring_outer_mm: 120.0
  threshold_block: 25
  threshold_c: 10

# 转盘取料点（任务码 2）
#   stop_strategy: motion = 连续几帧不动就算停稳
#                  containment = 物料完全落进取料点的边界圆才算到位
#   pick_point_mm: 取料点在画面里的位置（相对光轴，mm）。缺省 (0,0) = 画面中心
#   material_radius_mm: 物料半径（mm），containment 策略用它定边界圆半径
#   tol_mm / hold_s / pick_tol_mm: motion 策略的三个参数
#   containment_margin: containment 策略里边界圆 = 物料半径 × 该系数
turntable:
  stop_strategy: motion
  pick_point_mm: [0.0, 0.0]
  material_radius_mm: 25.0
  tol_mm: 8.0
  hold_s: 0.25
  pick_tol_mm: 25.0
  containment_margin: 1.15

# 物料颜色分割（转盘工位颜色识别用）
color:
  min_area: 800
  hsv_table:
    1: [[0,120,80],[10,255,255]]
    2: [[11,120,80],[25,255,255]]
    3: [[100,120,80],[124,255,255]]
    4: [[36,120,80],[77,255,255]]
    5: [[0,0,0],[180,255,80]]
    6: [[78,120,80],[99,255,255]]

# 相机外参（像素 → 车身毫米）。live/replay 建议提供：
#   对准主圆要用它把像素偏移换成毫米（有主圆外圈实测时以实测为准）；
#   转盘取料没有已知尺寸物，只能用它。
# 生成：python tools/calibrate_camera.py --pair px_x,px_y,mm_x,mm_y --out config/camera_calib.yaml
camera_calib_file: config/camera_calib.example.yaml
log_dir: logs
# make_camera 工厂输入：replay 指向视频文件或图片目录；sim 供 ImageFolder 循环回放
replay_path: tests/fixtures/imgs
sim_images: tests/fixtures/imgs
